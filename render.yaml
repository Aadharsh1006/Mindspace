services:
  # 1. Express MERN Node.js Backend Service
  - type: web
    name: mindspace-express-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: PYTHON_AI_URL
        sync: false

  # 2. Python Flask AI Microservice
  - type: web
    name: mindspace-python-ai
    env: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
